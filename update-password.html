<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>FicheAI — Nouveau mot de passe</title>
<link href="https://fonts.googleapis.com/css2?family=Syne:wght@600;700;800&family=DM+Sans:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{--bg:#09090f;--bg2:#0f0f1a;--bg3:#13131f;--surface:#1a1a2e;--border:rgba(255,255,255,0.07);--border2:rgba(255,255,255,0.13);--purple:#7c6dfa;--purple2:#a78bfa;--pink:#f472b6;--cyan:#22d3ee;--text:#f1f0ff;--text2:#a0a0c0;--text3:#5a5a7a;--font-h:'Syne',sans-serif;--font-b:'DM Sans',sans-serif;}
body{font-family:var(--font-b);background:var(--bg);color:var(--text);min-height:100vh;display:flex;flex-direction:column;}
nav{padding:1.2rem 2rem;display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid var(--border);}
.logo{font-family:var(--font-h);font-size:1.3rem;font-weight:800;background:linear-gradient(135deg,var(--purple2),var(--pink));-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;text-decoration:none;display:flex;align-items:center;gap:10px;}
.logo-icon{width:32px;height:32px;border-radius:8px;background:linear-gradient(135deg,var(--purple),var(--pink));display:flex;align-items:center;justify-content:center;flex-shrink:0;}
.logo-icon svg{width:16px;height:16px;}
main{flex:1;display:flex;align-items:center;justify-content:center;padding:2rem 1.5rem;}
.auth-container{width:100%;max-width:440px;}
.auth-header{text-align:center;margin-bottom:2rem;}
.auth-header h1{font-family:var(--font-h);font-size:1.8rem;font-weight:800;margin-bottom:0.5rem;}
.auth-header p{font-size:0.9rem;color:var(--text2);}
.auth-card{background:var(--bg2);border:1px solid var(--border2);border-radius:20px;padding:2rem;}
.form-group{margin-bottom:1.2rem;}
.form-group label{display:block;font-size:0.82rem;font-weight:600;color:var(--text2);margin-bottom:6px;}
.form-group input{width:100%;background:var(--bg3);border:1.5px solid var(--border2);border-radius:10px;padding:0.8rem 1rem;font-size:0.9rem;color:var(--text);font-family:var(--font-b);outline:none;transition:border 0.2s;}
.form-group input:focus{border-color:var(--purple);}
.form-group input::placeholder{color:var(--text3);}
.btn-submit{width:100%;padding:0.9rem;border:none;border-radius:12px;font-size:0.95rem;font-weight:700;cursor:pointer;font-family:var(--font-b);background:linear-gradient(135deg,var(--purple),var(--pink));color:white;transition:all 0.25s;margin-top:0.5rem;display:block;}
.btn-submit:hover{opacity:0.9;transform:translateY(-1px);}
.btn-submit:disabled{opacity:0.5;cursor:not-allowed;transform:none;}
.msg-error{background:rgba(244,114,182,0.08);border:1px solid rgba(244,114,182,0.2);border-radius:10px;padding:0.75rem 1rem;font-size:0.83rem;color:#f09595;margin-bottom:1rem;display:none;}
.msg-success{background:rgba(74,222,128,0.08);border:1px solid rgba(74,222,128,0.2);border-radius:10px;padding:0.75rem 1rem;font-size:0.83rem;color:#4ade80;margin-bottom:1rem;display:none;}
.invalid-state{text-align:center;padding:2rem;}
.invalid-state p{color:var(--text2);font-size:0.9rem;margin-bottom:1.5rem;}
.invalid-state a{color:var(--purple2);text-decoration:none;}
.invalid-state a:hover{text-decoration:underline;}
footer{padding:1.5rem;text-align:center;font-size:0.78rem;color:var(--text3);border-top:1px solid var(--border);}
</style>
</head>
<body>
<nav>
  <a href="/" class="logo">
    <div class="logo-icon"><svg viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2L2 7l10 5 10-5-10-5z"/><path d="M2 17l10 5 10-5"/><path d="M2 12l10 5 10-5"/></svg></div>
    FicheAI
  </a>
</nav>
<main>
  <div class="auth-container">
    <div class="auth-header">
      <h1>Nouveau mot de passe 🔒</h1>
      <p>Choisis un nouveau mot de passe pour ton compte</p>
    </div>
    <div class="auth-card" id="form-card">
      <div id="msg-error" class="msg-error"></div>
      <div id="msg-success" class="msg-success"></div>
      <div id="form-content">
        <div class="form-group">
          <label>Nouveau mot de passe</label>
          <input type="password" id="password" placeholder="Au moins 6 caractères" autocomplete="new-password">
        </div>
        <div class="form-group">
          <label>Confirmer le mot de passe</label>
          <input type="password" id="password-confirm" placeholder="Répète le mot de passe" autocomplete="new-password">
        </div>
        <button class="btn-submit" id="submit-btn">Enregistrer le mot de passe →</button>
      </div>
      <div class="invalid-state" id="invalid-state" style="display:none;">
        <p>Ce lien est invalide ou a expiré.<br>Demande un nouveau lien depuis la page de connexion.</p>
        <a href="/login.html">← Retour à la connexion</a>
      </div>
    </div>
  </div>
</main>
<footer>FicheAI · Fait pour les étudiants 🎓 · © 2025</footer>

<script>
var SUPABASE_URL = 'https://qyjqtjrqnlbgtxvnjvnk.supabase.co';
var SUPABASE_KEY = 'sb_publishable_opljKH5NsZwkuLpYQAyh4A_9FwNc4yJ';

// Supabase envoie le token dans le hash de l'URL sous deux formes possibles :
// 1. Ancien format (implicite) : #access_token=xxx&type=recovery
// 2. Nouveau format PKCE : ?code=xxx (géré différemment)
// On gère ici le format hash classique.

var accessToken = null;

function parseHash() {
  var hash = window.location.hash.substring(1);
  var params = {};
  hash.split('&').forEach(function(part) {
    var kv = part.split('=');
    if (kv.length === 2) params[kv[0]] = decodeURIComponent(kv[1]);
  });
  return params;
}

function init() {
  var params = parseHash();

  if (params.type === 'recovery' && params.access_token) {
    // Token valide trouvé dans le hash
    accessToken = params.access_token;
    // Nettoyer le hash de l'URL sans recharger la page
    history.replaceState(null, '', window.location.pathname);
  } else {
    // Pas de token — lien invalide ou expiré
    document.getElementById('form-content').style.display = 'none';
    document.getElementById('invalid-state').style.display = 'block';
  }
}

async function handleSubmit() {
  var btn = document.getElementById('submit-btn');
  var errBox = document.getElementById('msg-error');
  var successBox = document.getElementById('msg-success');
  var password = document.getElementById('password').value;
  var confirm = document.getElementById('password-confirm').value;

  errBox.style.display = 'none';
  successBox.style.display = 'none';

  if (!password || password.length < 6) {
    errBox.textContent = 'Le mot de passe doit faire au moins 6 caractères.';
    errBox.style.display = 'block';
    return;
  }
  if (password !== confirm) {
    errBox.textContent = 'Les deux mots de passe ne correspondent pas.';
    errBox.style.display = 'block';
    return;
  }

  btn.textContent = 'Enregistrement...';
  btn.disabled = true;

  try {
    var response = await fetch(SUPABASE_URL + '/auth/v1/user', {
      method: 'PUT',
      headers: {
        'Content-Type': 'application/json',
        'apikey': SUPABASE_KEY,
        'Authorization': 'Bearer ' + accessToken
      },
      body: JSON.stringify({ password: password })
    });

    var data = await response.json();

    if (response.ok && data.email) {
      successBox.textContent = 'Mot de passe mis à jour ! Redirection vers la connexion...';
      successBox.style.display = 'block';
      document.getElementById('form-content').style.display = 'none';
      setTimeout(function() {
        window.location.href = '/login.html';
      }, 2000);
    } else {
      var msg = (data.error_description || data.msg || data.message || 'Erreur inconnue.');
      // Token expiré (>1h après réception de l'email)
      if (msg.toLowerCase().includes('expired') || response.status === 401) {
        errBox.textContent = 'Ce lien a expiré. Demande un nouveau lien depuis la page de connexion.';
      } else {
        errBox.textContent = 'Erreur : ' + msg;
      }
      errBox.style.display = 'block';
      btn.disabled = false;
      btn.textContent = 'Enregistrer le mot de passe →';
    }
  } catch (e) {
    errBox.textContent = 'Erreur réseau. Vérifie ta connexion et réessaie.';
    errBox.style.display = 'block';
    btn.disabled = false;
    btn.textContent = 'Enregistrer le mot de passe →';
  }
}

document.getElementById('submit-btn').addEventListener('click', handleSubmit);
document.addEventListener('keydown', function(e) { if (e.key === 'Enter') handleSubmit(); });

init();
</script>
</body>
</html>
